name: Rebuild README PDF with fitted figures
on:
  push:
    paths: [.github/workflows/readme-pdf-figure-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Markdown, XeLaTeX, and figure inspection tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-japanese texlive-lang-chinese fonts-noto-cjk lmodern poppler-utils
          python -m pip install -q pymupdf
      - name: Rebuild PDF with image width constrained to the text block
        run: |
          cat > /tmp/fit-images.lua <<'LUA'
          function Image(el)
            el.attributes.width = "95%"
            return el
          end
          function Link(el)
            local target=el.target
            if not target:match("^[a-zA-Z][a-zA-Z0-9+.-]*:") and not target:match("^#") then
              local kind = target:match("/$") and "tree" or "blob"
              el.target = "https://github.com/blabo25226/bio_sdemodel_practice/" .. kind .. "/main/" .. target
            end
            return el
          end
          LUA
          pandoc README.md \
            --from=gfm+tex_math_dollars \
            --standalone \
            --pdf-engine=xelatex \
            --resource-path=. \
            --lua-filter=/tmp/fit-images.lua \
            -V papersize=a4 \
            -V fontsize=10pt \
            -V geometry:margin=18mm \
            -V mainfont='DejaVu Sans' \
            -V CJKmainfont='Noto Sans CJK JP' \
            -V colorlinks=true \
            -V linkcolor=blue \
            -o '1028研究報告_README.pdf'
      - name: Verify no image extends outside its PDF page
        run: |
          python - <<'PY'
          import fitz
          path = "1028研究報告_README.pdf"
          doc = fitz.open(path)
          n = 0
          for i,p in enumerate(doc):
              for b in p.get_text("dict")["blocks"]:
                  if b["type"] != 1:
                      continue
                  n += 1
                  x0,y0,x1,y1 = b["bbox"]
                  if not (x0 >= -0.5 and y0 >= -0.5 and x1 <= p.rect.width+0.5 and y1 <= p.rect.height+0.5):
                      raise RuntimeError(f"Image outside page {i+1}: {b['bbox']} versus {p.rect}")
                  print(f"page {i+1} image bbox: {b['bbox']}")
          if n < 5:
              raise RuntimeError(f"Expected 5 report figures, found {n}")
          print(f"VERIFIED: {len(doc)} pages, {n} images entirely within page bounds")
          PY
          pdftotext -layout '1028研究報告_README.pdf' /tmp/report.txt
          grep -q 'Neural SDE' /tmp/report.txt
          grep -q '58.6%' /tmp/report.txt
          pdfinfo '1028研究報告_README.pdf' | grep -E '^(Pages:|Page size:|File size:)'
          pdftoppm -f 5 -l 5 -scale-to 1200 -png -singlefile '1028研究報告_README.pdf' page5_after
      - name: Replace old report and save preview for visual audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '1028研究報告_README.pdf' page5_after.png
          git commit -m 'docs: fix clipped README report figures and rebuild PDF'
          git push origin main
